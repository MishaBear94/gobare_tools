name: CLI Release

on:
  push:
    tags:
      - 'tools-v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm release:pack
      - run: pnpm release:verify
      - name: Verify release manifest
        run: |
          test -f release/SHA256SUMS
          test -f release/release-manifest.json
          cd release
          sha256sum --check SHA256SUMS
      - name: Attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tgz
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tgz
            release/SHA256SUMS
            release/release-manifest.json
          generate_release_notes: true
          body: |
            This is a signed provenance-attested Node.js 22+ CLI package.
            Verify SHA-256 before installing. This release intentionally does not claim a standalone native binary.
